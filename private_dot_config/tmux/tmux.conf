set-option -g prefix C-a
bind-key C-a last-window
bind r source-file ~/.config/tmux/tmux.conf \; display "config reloaded"

unbind [
bind Escape copy-mode
unbind p
bind p paste-buffer
bind-key -Tcopy-mode-vi 'v' send -X begin-selection
bind-key -Tcopy-mode-vi 'y' send -X copy-selection

set -g default-terminal "tmux-256color"
set -ag terminal-features '*:hyperlinks'
set -as terminal-features ',*:RGB'
# Pass cursor shape changes through to the outer terminal (bar in insert, block in normal)
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[2 q'
set -sg escape-time 50
set -as terminal-overrides '*:Ss=\E[%p1%d q:Se=\E[5 q'
set -g cursor-style blinking-bar
set -g aggressive-resize on
set -g mouse on
set -g focus-events on
set -g history-limit 50000
set -g renumber-windows on
set -g set-clipboard on

setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

bind '"' split-window -c "#{pane_current_path}"
bind "'" split-window -h -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

bind -n C-h previous-window
bind -n C-l next-window
bind -n S-Left swap-window -t -1
bind -n S-Right swap-window -t +1

set -g base-index 1
set -g pane-base-index 1

bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

set-option -g status on
set-option -g status-interval 2
set-option -g set-titles on
set-option -g set-titles-string "#T"

set-window-option -g automatic-rename on
set-window-option -g extended-keys on
set -g window-status-format " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator ""

# Zenburn status bar
set -g status-style          "bg=#3f3f3f,fg=#dcdccc"
set -g status-left           "#[fg=#7f9f7f,bold] #S "
set -g status-right          '#(gitmux "#{pane_current_path}")'
set -g window-status-style         "fg=#656555"
set -g window-status-current-style "fg=#f0dfaf,bold"
set -g pane-border-style           "fg=#4f4f4f"
set -g pane-active-border-style    "fg=#8cd0d3"
set -g message-style               "bg=#3f3f3f,fg=#f0dfaf"
set -g display-panes-colour        "#dfaf8f"
set -g display-panes-active-colour "#8cd0d3"
set -g clock-mode-colour           "#7f9f7f"
